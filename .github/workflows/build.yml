name: Gerar launcher (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'config.json', 'package.json', '.github/workflows/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Baixar Java 8 embutido (Temurin JRE x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/java8 | Out-Null
          Invoke-WebRequest "https://api.adoptium.net/v3/binary/latest/8/ga/windows/x64/jre/hotspot/normal/eclipse" -OutFile java8.zip
          Expand-Archive java8.zip -DestinationPath runtime/java8
          Get-ChildItem runtime/java8

      - name: Gerar instalador
        run: npm run dist

      - name: Ler versao
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Publicar release v${{ steps.ver.outputs.v }} (neste repositorio)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Launcher v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            Arquivos para subir na release mais recente do ryan1235/DeathAwaits (atualizacao automatica dos launchers):
            DeathAwaits-Launcher-Setup-${{ steps.ver.outputs.v }}.exe, o .blockmap e o latest.yml.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Enviar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: DeathAwaits-Launcher
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
